name: "Release features"

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  publish:
    name: "Publish to GHCR"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: "Publish features"
        uses: devcontainers/action@v1
        with:
          publish-features: "true"
          base-path-to-features: "./src"
