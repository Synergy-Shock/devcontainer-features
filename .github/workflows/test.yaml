name: "Test features"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-autogenerated:
    name: "Autogenerated tests / ${{ matrix.feature }} on ${{ matrix.base-image }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # claude / gitbutler / opencode are Node-less — test on the bare base
          # across all current Debian + Ubuntu LTS releases.
          - feature: claude
            base-image: mcr.microsoft.com/devcontainers/base:trixie
          - feature: claude
            base-image: mcr.microsoft.com/devcontainers/base:bookworm
          - feature: claude
            base-image: mcr.microsoft.com/devcontainers/base:bullseye
          - feature: claude
            base-image: mcr.microsoft.com/devcontainers/base:noble
          - feature: claude
            base-image: mcr.microsoft.com/devcontainers/base:jammy
          - feature: claude
            base-image: mcr.microsoft.com/devcontainers/base:focal

          # gitbutler's upstream binary needs glibc >= 2.32, so bullseye
          # (Debian 11, glibc 2.31) and focal (Ubuntu 20.04, glibc 2.31) are
          # excluded.
          - feature: gitbutler
            base-image: mcr.microsoft.com/devcontainers/base:trixie
          - feature: gitbutler
            base-image: mcr.microsoft.com/devcontainers/base:bookworm
          - feature: gitbutler
            base-image: mcr.microsoft.com/devcontainers/base:noble
          - feature: gitbutler
            base-image: mcr.microsoft.com/devcontainers/base:jammy

          - feature: opencode
            base-image: mcr.microsoft.com/devcontainers/base:trixie
          - feature: opencode
            base-image: mcr.microsoft.com/devcontainers/base:bookworm
          - feature: opencode
            base-image: mcr.microsoft.com/devcontainers/base:bullseye
          - feature: opencode
            base-image: mcr.microsoft.com/devcontainers/base:noble
          - feature: opencode
            base-image: mcr.microsoft.com/devcontainers/base:jammy
          - feature: opencode
            base-image: mcr.microsoft.com/devcontainers/base:focal

          # node uses the official Linux prebuilt tarball; Node 24 LTS requires
          # glibc >= 2.28, which is satisfied by all six base images (focal and
          # bullseye both ship glibc 2.31).
          - feature: node
            base-image: mcr.microsoft.com/devcontainers/base:trixie
          - feature: node
            base-image: mcr.microsoft.com/devcontainers/base:bookworm
          - feature: node
            base-image: mcr.microsoft.com/devcontainers/base:bullseye
          - feature: node
            base-image: mcr.microsoft.com/devcontainers/base:noble
          - feature: node
            base-image: mcr.microsoft.com/devcontainers/base:jammy
          - feature: node
            base-image: mcr.microsoft.com/devcontainers/base:focal
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('.github/workflows/test.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install @devcontainers/cli
        run: pnpm add -g @devcontainers/cli
      - name: Run autogenerated tests
        run: |
          devcontainer features test \
            --features "${{ matrix.feature }}" \
            --base-image "${{ matrix.base-image }}" \
            --skip-scenarios \
            --project-folder .

  test-scenarios:
    name: "Scenario tests / ${{ matrix.feature }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: [claude, gitbutler, opencode, node]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('.github/workflows/test.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install @devcontainers/cli
        run: pnpm add -g @devcontainers/cli
      - name: Run scenario tests
        run: |
          devcontainer features test \
            --features "${{ matrix.feature }}" \
            --skip-autogenerated \
            --project-folder .

  test-global:
    name: "Global scenarios"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('.github/workflows/test.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install @devcontainers/cli
        run: pnpm add -g @devcontainers/cli
      - name: Run global scenarios
        run: |
          devcontainer features test \
            --global-scenarios-only \
            --project-folder .
